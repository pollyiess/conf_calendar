  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare test database and build CSS
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare tailwindcss:build

      - name: Run RSpec
        run: bundle exec rspec